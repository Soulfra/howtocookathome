name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build static site
        run: python3 -m app.publish

      - name: Copy static pages to output
        run: |
          cp templates/about.html output/web/about.html
          cp templates/onboard.html output/web/onboard.html
          cp templates/terms.html output/web/terms.html
          cp templates/guide.html output/web/guide.html
          cp templates/scanner.html output/web/scanner.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
