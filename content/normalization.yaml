# =====================
# MEASUREMENTS
# =====================
# Not synonyms per se, but unit normalization is part of the same problem.
measurements:

  volume:
    tsp:
      display: "tsp"
      synonyms: [teaspoon, teaspoons, t, t.]
      ml: 4.93
    tbsp:
      display: "tbsp"
      synonyms: [tablespoon, tablespoons, T, T., tbl, tbs]
      ml: 14.79
    cup:
      display: "cup"
      synonyms: [cups, c, c.]
      ml: 236.59
    fl_oz:
      display: "fl oz"
      synonyms: [fluid ounce, fluid ounces, fl. oz.]
      ml: 29.57

  weight:
    oz:
      display: "oz"
      synonyms: [ounce, ounces, oz.]
      grams: 28.35
    lb:
      display: "lb"
      synonyms: [pound, pounds, lbs, lbs.]
      grams: 453.59
    g:
      display: "g"
      synonyms: [gram, grams, gm]
    kg:
      display: "kg"
      synonyms: [kilogram, kilograms]
      grams: 1000

  informal:
    # These show up in recipes constantly and need conversion guidance
    pinch:
      display: "pinch"
      approx_tsp: 0.0625   # ~1/16 tsp
    dash:
      display: "dash"
      approx_tsp: 0.125    # ~1/8 tsp
    handful:
      display: "handful"
      note: "too variable to normalize — flag for human review"
    bunch:
      display: "bunch"
      note: "varies wildly by store and region — flag for human review"

# =====================
# INTAKE PIPELINE RULES
# =====================
pipeline:

  on_match:
    # When a synonym matches a canonical term
    action: replace_with_canonical
    preserve_original: true    # keep raw text in _original field for audit

  on_ambiguous:
    # When a term appears in multiple canonical entries' ambiguous lists
    action: flag_for_review
    default: null              # don't guess — queue it

  on_unknown:
    # When no synonym matches at all
    action: add_to_review_queue
    auto_suggest: true         # use fuzzy match to suggest canonical

  fuzzy_threshold: 0.85        # Levenshtein similarity threshold for auto-suggest

  regional_variants:
    # Detect and normalize regional spelling/terminology
    uk_to_us:
      aubergine: eggplant
      courgette: zucchini
      rocket: arugula
      caster_sugar: superfine_sugar
      icing_sugar: powdered_sugar
      plain_flour: all_purpose_flour
      strong_flour: bread_flour
      bicarbonate_of_soda: baking_soda
      clingfilm: plastic_wrap
      grill: broil              # the technique, not the equipment
      hob: stovetop
      liquidiser: blender
      bain_marie: double_boiler

  # Where the normalizer sits in the connector chain
  runs_at: intake
  # Every connector that reads external input MUST run normalization
  # before writing to source/. This is not optional.
  required_for:
    - csv-import
    - recipe-card-scan
    - audio-review
    - url-scrape
    - paste-input
