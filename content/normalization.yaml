# ============================================
# NORMALIZATION LAYER (synonym-only)
# ============================================
# This file is a SYNONYM LAYER that sits ON TOP of the USDA
# foundation database (data/usda/foundation.db).
#
# Architecture:
#   normalization.yaml  ← YOU ARE HERE (synonyms → USDA IDs)
#   foundation.db       ← canonical ingredients (USDA FoodData Central)
#
# When intake.py processes a recipe:
#   1. Check normalization.yaml first (synonym match)
#   2. If no match, query foundation.db (fuzzy name search)
#   3. If still no match, flag for review
#
# This file does NOT define ingredients — USDA does.
# This file maps the messy real-world names people use
# to the canonical USDA FDC IDs in foundation.db.
#
# --- How it works ---
# 1. Raw input: "2 bunches scallions, chopped"
# 2. Normalizer checks synonyms → "scallions" matches "green_onion"
# 3. green_onion has usda_fdc_id → pulls nutrition from foundation.db
# 4. YAML output: { item: green_onion, amount: "2 bunches", prep: chopped }
#
# If usda_fdc_id is null, the ingredient exists as a synonym group
# but hasn't been mapped to USDA yet (e.g., green onion isn't in
# the demo foundation — it will be when full CSV import runs).

version: 1

